(observed at target pin 6f1ef4e5): instance drift between the two revisions,
not a copying defect. Formal Conjectures' own bump to Lean 4.33 rewrites the
source against the target-side Mathlib and retires the gap; re-run the audit
after the bump and remove this entry."""
