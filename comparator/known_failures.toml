# Declarations the whole-set audit is expected to fail on, each with the
# reason and the stage it fails at. `--known-failures` asserts this list
# exactly: an unexpected failure and a silently fixed one both fail the run,
# because a gate that only ever passes proves nothing.
#
#   declaration  the qualified FC declaration name
#   workspace    the workspace id, for the target-stage compile report
#   stage        "source" (import or --verify at FC pins) or
#                "target" (compile at LeanEval pins)
#   reason       what fails and why it is not fixed here

[[failure]]
declaration = "Erdos1092.f_asymptotic_general"
workspace = "Erdos1092_f_asymptotic_general"
stage = "target"
reason = """The copied `f` definition synthesizes `Fintype ↑H.verts` and
`Fintype ↑H.coe.edgeSet` at this repository's Mathlib but not at LeanEval's
(observed at target pin 6f1ef4e5): instance drift between the two revisions,
not a copying defect. Formal Conjectures' planned toolchain bump (to Lean 4.33;
#4428 stages v4.32.0) adapts the source and retires the gap — kim-em verified on
2026-08-21 that the generated Challenge compiles at LeanEval's target pins on a
merge with #4428. Re-run the audit after the bump merges and remove this entry."""

[[failure]]
declaration = "EllipticCurveRank.RatEllipticCurve.twentyone_le_rank_height_count_asymptotic"
workspace = "EllipticCurveRank_RatEllipticCurve_twentyone_le_rank_height_count_asymptotic"
stage = "target"
reason = """The copied `toWeierstrass⟮ℚ⟯` Mordell-Weil notation elaborates at
this repository's Mathlib but not at LeanEval's (observed at target pin
6f1ef4e5): the notation's shape changed between the two revisions, in a
dependency copied faithfully from source. Retired by the repository's planned
toolchain bump (to Lean 4.33; #4428 stages v4.32.0) — kim-em verified on
2026-08-21 at LeanEval's target pins on a merge with #4428. Re-run the audit
after the bump merges and remove this entry."""

[[failure]]
declaration = "Erdos125.erdos_125.variants.positive_unequal_density"
workspace = "Erdos125_erdos_125_variants_positive_unequal_density"
stage = "target"
reason = """The statement's `local notation` uses set-builder syntax and needs
`set_option quotPrecheck false`, which the source states file-scoped and the
emitted module carries attached to the notation command. The generator's
Challenge reconstruction re-extracts the notation line without its
set_option, and `Challenge.lean` is generator-owned text this side cannot
amend. Fixed upstream in leanprover/lean-eval-generator#1 (verified by kim-em at
this PR's head); remove this entry when `[generator]` in tools.toml advances to a
revision containing that fix."""
