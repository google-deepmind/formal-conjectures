name: Audit Erdős 526 proof
on:
  push:
    branches: [codex/erdos-526]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl --fail --silent --show-error --location https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve Mathlib cache
        run: lake exe cache get
      - name: Build changed module with warnings as errors
        run: lake --wfail build 'FormalConjectures.ErdosProblems.«526»'
