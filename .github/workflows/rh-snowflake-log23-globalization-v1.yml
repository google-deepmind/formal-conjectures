name: RH Snowflake log2-log3 globalization v1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'FormalConjectures/Millennium/RHSnowflakeLog23.lean'
      - 'AEGISOverlay/**'
      - 'AegisRH/SmallWindow/**'
      - 'scripts/verify_rh_overlay_axioms.py'
      - '.github/workflows/rh-snowflake-log23-globalization-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  AEGIS_SHA: 2c3d041b633147ec97c7ef753aa9d157a47bb9f5
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  FACTORIZATION_SOURCE_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2

jobs:
  log23-density:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      - name: Compile snowflake density theorem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/FormalConjectures/Millennium
          lake env lean -o .lake/build/lib/lean/FormalConjectures/Millennium/RHSnowflakeLog23.olean FormalConjectures/Millennium/RHSnowflakeLog23.lean 2>&1 | tee snowflake-log23.log
          python3 scripts/verify_rh_overlay_axioms.py FormalConjectures/Millennium/RHSnowflakeLog23.lean snowflake-log23.log
          ! grep -F 'sorryAx' snowflake-log23.log
          ! grep -F 'error:' snowflake-log23.log
          grep -F 'RHSnowflakeLog23.irrational_log_two_div_log_three' snowflake-log23.log
          grep -F 'RHSnowflakeLog23.snowflake_shift_group_dense' snowflake-log23.log
          grep -F 'RHSnowflakeLog23.snowflake_nonnegative_of_continuous' snowflake-log23.log

      - name: Upload proof replay log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-snowflake-log23-${{ github.sha }}-${{ github.run_id }}
          path: snowflake-log23.log
          if-no-files-found: warn
          retention-days: 30

      - name: Compile and audit width quantifier obstruction
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AEGISOverlay/RHWidthQuantifierObstructionV1.lean 2>&1 | tee width-obstruction.log
          python3 scripts/verify_rh_overlay_axioms.py AEGISOverlay/RHWidthQuantifierObstructionV1.lean width-obstruction.log

      - name: Upload width obstruction replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-width-obstruction-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: width-obstruction.log
          if-no-files-found: warn
          retention-days: 30

      - name: Checkout exact AEGIS source for independent analytic lemmas
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Compile small analytic source closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$AEGIS_SHA"
          mkdir -p evidence-structural .lake/build/lib/lean/AEGISOverlay
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          for m in WeilCriterionCompactSmoothV1 WeilDigammaIntegralReductionV1 WeilDigammaSeriesRealV1 WeilDigammaSeriesHalfPlaneV1 RHEulerGammaV13 RHKreinFactorV13 ZeroHeightFiniteSumV1 ZeroHeightLimitContractV1 ZeroHeightSummabilityBridgeV1 ZeroMajorantSummabilityV1 ZeroCriticalStripV1 ZeroHeightShellMassV1 ZeroShellQuadraticBoundV1 ZeroShellAnalyticSynthesisV1 MellinDecayEstimateV1 WeilMellinInversionV1; do
            cp "$ROOT/$m.lean" "$m.lean"
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "evidence-structural/source-$m.log"
          done

      - name: Replay archived compact smooth two-moment right inverse
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$AEGIS_SHA"
          ROOT=".aegis/sovereign-omega-v2/formal/bridges/lean"
          mkdir -p evidence-moment-potential .lake/build/lib/lean
          test "$(git hash-object "$ROOT/WeilMomentKillerConstructionV1.lean")" = "f599d884d0d59f7e652887fb9e055ce95ea54aa6"
          cp "$ROOT/WeilMomentKillerConstructionV1.lean" WeilMomentKillerConstructionV1.lean
          lake env lean -o .lake/build/lib/lean/WeilMomentKillerConstructionV1.olean WeilMomentKillerConstructionV1.lean 2>&1 | tee evidence-moment-potential/WeilMomentKillerConstructionV1.log
          for entry in RHMomentPotentialV4:23e2de9c703c09ac4b0c9502ef622d041b5afa29 RHMomentPotentialSupportV1:d134ba3de9fa4b93aeb48999669be41c5b057faa; do
            m="${entry%%:*}"
            expected_blob="${entry#*:}"
            src="research/rh/verified_archive_sources/$m.lean.src"
            test -f "$src"
            test "$(git hash-object "$src")" = "$expected_blob"
            cp "$src" "$m.lean"
            # The source-locked RHMomentPotentialV4 emits a known style-only focus warning.
            # Disable only that linter for this replay; keep warnings/errors/sorryAx admission fail-closed.
            if [ "$m" = "RHMomentPotentialV4" ]; then
              lake env lean -D linter.unnecessarySeqFocus=false -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "evidence-moment-potential/$m.log"
            else
              lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "evidence-moment-potential/$m.log"
            fi
            python3 scripts/verify_rh_overlay_axioms.py "$m.lean" "evidence-moment-potential/$m.log"
            printf '%s %s %s\n' "$m" "$expected_blob" "$(sha256sum "$src" | cut -d' ' -f1)" >> evidence-moment-potential/source-lock.txt
          done
          git rev-parse HEAD > evidence-moment-potential/fork-head.txt
          git -C .aegis rev-parse HEAD > evidence-moment-potential/aegis-head.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence-moment-potential/mathlib-head.txt
          lean --version > evidence-moment-potential/lean-version.txt

      - name: Upload compact moment potential proof receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-moment-potential-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: evidence-moment-potential/
          if-no-files-found: warn
          retention-days: 30

      - name: Compile and audit complementary symbols and Euler operator obstruction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-structural .lake/build/lib/lean/AEGISOverlay
          result=0
          for m in RHMultiGeneratorComplementarityV1 RHEulerOperatorObstructionV1 RHPrimePowerBoundedV1 RHBoundedConvolutionV1 RHBoxFourierComplementarityV1 RHGenericSpectralShiftV1 RHKreinSplineSupportV1 RHKreinSplineContinuityV1 RHKreinSplineFourierIntegrableV1 RHKreinSplineDerivativesV1 RHKreinDigammaLowerBoundV1 RHKreinDigammaMonotonicityV1 RHLocalKreinPartitionV1 RHCompactMellinEntireV1; do
            if ! lake env lean -o ".lake/build/lib/lean/AEGISOverlay/$m.olean" "AEGISOverlay/$m.lean" 2>&1 | tee "evidence-structural/$m.log"; then result=1; fi
            if ! python3 scripts/verify_rh_overlay_axioms.py "AEGISOverlay/$m.lean" "evidence-structural/$m.log"; then result=1; fi
          done
          git rev-parse HEAD > evidence-structural/formal-conjectures-sha.txt
          exit "$result"

      - name: Upload structural replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-structural-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: evidence-structural/
          if-no-files-found: warn
          retention-days: 30

  prime3-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"

      - name: Checkout exact AEGIS #679 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Compile exact AEGIS dyadic-window dependency closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$AEGIS_SHA"
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          mkdir -p evidence .lake/build/lib/lean
          python3 - "$ROOT" evidence/prime3-aegis-modules.txt <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          target="RHDyadicWindowV13"
          mods={p.stem:p for p in root.glob("*.lean")}
          if target not in mods:
              raise SystemExit(f"missing target: {target}")
          deps={}
          for m,p in mods.items():
              ds=[]
              for line in p.read_text(encoding="utf-8").splitlines():
                  s=line.strip()
                  if not s.startswith("import "):
                      continue
                  for token in s[len("import "):].split():
                      local=token.split(".")[0]
                      if local in mods:
                          ds.append(local)
              deps[m]=ds
          seen=set(); active=set(); order=[]
          def visit(m):
              if m in seen: return
              if m in active: raise SystemExit("cycle:"+m)
              active.add(m)
              for d in deps[m]: visit(d)
              active.remove(m); seen.add(m); order.append(m)
          visit(target)
          out.write_text("\n".join(order)+"\n")
          print("PRIME3_AEGIS_CLOSURE_COUNT",len(order))
          print("\n".join(order))
          PY
          while IFS= read -r m; do
            cp "$ROOT/$m.lean" "$m.lean"
            echo "=== COMPILE $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "evidence/prime3-$m.log"
          done < evidence/prime3-aegis-modules.txt

      - name: Compile prime-3 translation theorem
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AEGISOverlay/RHPrimeThreeWindowV1.lean 2>&1 | tee evidence/prime3-overlay.log
          ! grep -F 'sorryAx' evidence/prime3-overlay.log
          ! grep -F 'error:' evidence/prime3-overlay.log
          grep -F 'AEGIS.RHPrimeThreeWindowV1.nat_eq_pow_three_of_log_window' evidence/prime3-overlay.log
          grep -F 'AEGIS.RHPrimeThreeWindowV1.gap_prime_sum_exact_three' evidence/prime3-overlay.log
          grep -F 'AEGIS.RHPrimeThreeWindowV1.gap_B_norm_bound_three' evidence/prime3-overlay.log

      - name: Upload prime-3 replay logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-prime3-window-${{ github.sha }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30


  krein-critical-line:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify local RH proof imports before installing Lean
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_verify_rh_compile_graph_v1.py -v
          python3 scripts/verify_rh_compile_graph_v1.py

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"

      - name: Checkout exact AEGIS #679 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact LiCriterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          path: .li-provider
          fetch-depth: 1
          persist-credentials: false

      - name: Restore pinned provider build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li-provider/.lake/build
          key: rh-li-provider-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.LI_CRITERION_SHA }}-${{ env.MATHLIB_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}

      - name: Build exact LiCriterion provider for Krein closure
        id: provider-build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .li-provider rev-parse HEAD)" = "$LI_CRITERION_SHA"
          test "$(git -C .li-provider hash-object Hadamard/General/Factorization.lean)" = "$FACTORIZATION_SOURCE_BLOB"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path('.li-provider')
          p=root/'lakefile.lean'
          text=p.read_text()
          old=os.environ['LI_CRITERION_ORIGINAL_MATHLIB_SHA']
          new=os.environ['MATHLIB_SHA']
          assert old in text
          p.write_text(text.replace(old,new))
          fp=root/'Hadamard/General/Factorization.lean'
          text=fp.read_text()
          replacements=[
            ('eventually_nhdsWithin_of_forall fun w hw => ite_eq_right hw',
             'eventually_nhdsWithin_of_forall fun w hw => if_neg hw'),
            ('have hgz : g z = Q z := ite_eq_left rfl',
             'have hgz : g z = Q z := by simp [g]'),
            ('rw [ite_eq_right heq, hQ_eq_div z (hz heq)]',
             'rw [if_neg heq, hQ_eq_div z (hz heq)]'),
          ]
          for old,new in replacements:
              assert text.count(old)==1
              text=text.replace(old,new)
          fp.write_text(text)
          PY
          rm -f .li-provider/lake-manifest.json
          printf '%s\n' "$LEAN_TOOLCHAIN" > .li-provider/lean-toolchain
          (
            cd .li-provider
            export PATH="$HOME/.elan/bin:$PATH"
            lake update mathlib
            lake exe cache get
            lake build Hadamard.OrderOne.LogDerivMultiplicity Lc.LiCriterion.XiGrowth Lc.LiCriterion.HadamardSummabilityBridge Lc.LiCriterion.HadamardBridge
          )
          cp -R .li-provider/Lc .
          cp -R .li-provider/Hadamard .
          cp -R .li-provider/FunctionsOfOneComplexVariable .
          mkdir -p .lake/build/lib/lean/Lc .lake/build/lib/lean/Hadamard .lake/build/lib/lean/FunctionsOfOneComplexVariable
          cp -R .li-provider/.lake/build/lib/lean/Lc/. .lake/build/lib/lean/Lc/
          cp -R .li-provider/.lake/build/lib/lean/Hadamard/. .lake/build/lib/lean/Hadamard/
          cp -R .li-provider/.lake/build/lib/lean/FunctionsOfOneComplexVariable/. .lake/build/lib/lean/FunctionsOfOneComplexVariable/

      - name: Save pinned provider build for subsequent proof iterations
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li-provider/.lake/build
          key: rh-li-provider-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.LI_CRITERION_SHA }}-${{ env.MATHLIB_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}

      - name: Compile exact AEGIS Krein dependency closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$AEGIS_SHA"
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          mkdir -p evidence-krein .lake/build/lib/lean
          python3 - "$ROOT" evidence-krein/modules.txt <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          targets=["WeilAutocorrelationMellinV11","RHKreinPairingV13","RHDyadicTowerV13","RHRestrictedWeilBridgeV13","WeilZeroTranslationV11","RHGramExpansionV13","RestrictedWeilCriterionResidueWitnessV11","WeilThreeBlockPrimeEvaluationV30","RHKreinFactorV13","WeilMomentAnnihilatorV1","WeilRHImpliesFinalSignV13","WeilTwoPointPositivityV1","RHEulerGammaV13","RHNarrowMomentPacketV1","WeilSeparatedArchBridgeV31","WeilThreeBlockCrossAssemblyV30","WeilWindowExhaustionV1","RHNarrowDiagonalUpgradeV2","RestrictedWeilCriterionZeroKernelV10","RHThreeCellClassV13","WeilPrimeSummabilityV1","WeilAutocorrelationClosureV1","RHHatCoxClass693V13"]
          mods={p.stem:p for p in root.glob("*.lean")}
          for target in targets:
              if target not in mods:
                  raise SystemExit(f"missing target: {target}")
          deps={}
          for m,p in mods.items():
              ds=[]
              for line in p.read_text(encoding="utf-8").splitlines():
                  s=line.strip()
                  if not s.startswith("import "):
                      continue
                  for token in s[len("import "):].split():
                      local=token.split(".")[0]
                      if local in mods:
                          ds.append(local)
              deps[m]=ds
          seen=set(); active=set(); order=[]
          def visit(m):
              if m in seen: return
              if m in active: raise SystemExit("cycle:"+m)
              active.add(m)
              for d in deps[m]: visit(d)
              active.remove(m); seen.add(m); order.append(m)
          for target in targets: visit(target)
          out.write_text("\n".join(order)+"\n")
          print("KREIN_AEGIS_CLOSURE_COUNT",len(order))
          print("\n".join(order))
          PY
          while IFS= read -r m; do
            cp "$ROOT/$m.lean" "$m.lean"
            if [ "$m" = "RHNarrowMomentPacketV1" ]; then
              # Reconstruct the existing archive-verified source, not a new proof or source guess.
              test "$(git hash-object "$ROOT/$m.lean")" = "08ad4e9610a544152a223417eafc28ff3434a678"
              python3 - "$m.lean" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")
          replacements = [
              ("open Set MeasureTheory Filter\n",
               "open Set MeasureTheory Filter Metric\n", 1),
              ("inside the later +/-1/64 log packet window.",
               "inside the later ±1/64 log packet window.", 1),
              ("have hs := phiNarrow_tsupport_Icc hmem\n",
               "have hs := tsupport_momentKiller_subset psiNarrow hmem\n"
               "  rw [psiNarrow_tsupport, Real.closedBall_eq_Icc] at hs\n"
               "  norm_num at hs\n", 2),
              ("      rw [integral_mulPacket_inv\n",
               "      change ∫ x in Ioi (0 : ℝ), x⁻¹ * mulPacket phiNarrow x = 0\n"
               "      rw [integral_mulPacket_inv\n", 1),
              ("      rw [integral_mulPacket\n",
               "      change ∫ x in Ioi (0 : ℝ), mulPacket phiNarrow x = 0\n"
               "      rw [integral_mulPacket\n", 1),
              ("  unfold logLift gNarrow narrowPacketFn narrowRealPacket\n"
               "  rw [mulPacket_of_pos (Real.exp_pos t), Real.log_exp]\n"
               "  rfl\n",
               "  change (Real.exp (t / 2) : ℂ) * ((mulPacket phiNarrow (Real.exp t) : ℝ) : ℂ) =\n"
               "    (Real.exp (t / 2) : ℂ) * (phiNarrow t : ℂ)\n"
               "  rw [mulPacket_of_pos (Real.exp_pos t), Real.log_exp]\n", 1),
          ]
          for before, after, count in replacements:
              if text.count(before) != count:
                  raise SystemExit(f"RH_ARCHIVED_SOURCE_ANCHOR_MISMATCH: {before[:50]}")
              text = text.replace(before, after)
          if text.count("/-") != text.count("-/"):
              raise SystemExit("RH_ARCHIVED_SOURCE_LEXER_MISMATCH")
          p.write_text(text, encoding="utf-8")
          PY
              test "$(git hash-object "$m.lean")" = "6c95c436b4ece222d53c38882a5882dbba5cecb6"
              echo "RH_NARROW_ARCHIVED_COMPILED_BLOB=6c95c436b4ece222d53c38882a5882dbba5cecb6" \
                | tee evidence-krein/rh-narrow-source-identity.txt
              echo "RH_NARROW_PINNED_UPSTREAM_BLOB=08ad4e9610a544152a223417eafc28ff3434a678" \
                >> evidence-krein/rh-narrow-source-identity.txt
              echo "RH_NARROW_ARCHIVE_REFERENCE=AEGIS_RH_CLOSURE_CHECKPOINT.zip:closure/aegis_sources/RHNarrowMomentPacketV1.lean" \
                >> evidence-krein/rh-narrow-source-identity.txt
            fi
            echo "=== COMPILE $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "evidence-krein/$m.log"
          done < evidence-krein/modules.txt

      - name: Replay exact archived signed-prime and V14 kernel sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence-signed-archive .lake/build/lib/lean
          cat > evidence-signed-archive/source-lock.txt <<'PINS'
          RHNarrowFourBlockV2 36d07b81dbb67a765b4f3a37c50b16ee87ad1982
          RHNarrowArchV1 705f5524d644bdbbf8fa777dbf2e8810edd4e883
          WeilSignedPrimeKernelV1 4ef031bb4ff987de2687964b92649988acbfbc12
          WeilSignedKernelReductionV1 5c62344e0c659624e30e3843bbda4b4dc5f5a462
          WeilGeneralSignedKernelBoundV1 3cd1cfd5ea2659452aea4b963824e8b08aff6b88
          WeilSignedPrimeEventualBridgeV1 e342ba5a694f58dd59e88818f07637f9a1ec53cd
          RHBoundedKernelLaplaceV14 c1307d86bab3d6a2febcec613a4b00e6a5e03087
          RHBoundedKernelCriterionV14 476eba8d560fba42bef9bce93efd857a82e7bad8
          PINS
          while read -r module blob; do
            echo "=== ARCHIVED BLOB $module $blob ==="
            url="https://api.github.com/repos/tarikskalic33/formal-conjectures/git/blobs/$blob"
            curl -fsSL --retry 3 --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" "$url" |
              python3 -c 'import sys,json,base64; x=json.load(sys.stdin); assert x["encoding"]=="base64"; sys.stdout.buffer.write(base64.b64decode(x["content"]))' > "$module.lean"
            test "$(git hash-object "$module.lean")" = "$blob"
            lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean" \
              2>&1 | tee "evidence-signed-archive/$module.log"
            ! grep -F 'sorryAx' "evidence-signed-archive/$module.log"
            ! grep -F 'error:' "evidence-signed-archive/$module.log"
          done < evidence-signed-archive/source-lock.txt

      - name: Upload signed-prime archived proof logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-signed-archive-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: evidence-signed-archive/
          if-no-files-found: warn
          retention-days: 30

      - name: Compile critical-line Mellin Fourier bridge
        shell: bash
        run: |
          set -euo pipefail
          cp AEGISOverlay/RHKreinCriticalLineBridgeV1.lean RHKreinCriticalLineBridgeV1.lean
          lake env lean -o .lake/build/lib/lean/RHKreinCriticalLineBridgeV1.olean RHKreinCriticalLineBridgeV1.lean 2>&1 | tee evidence-krein/overlay.log
          ! grep -F 'sorryAx' evidence-krein/overlay.log
          ! grep -F 'error:' evidence-krein/overlay.log
          grep -F 'AEGIS.RHKreinCriticalLineBridgeV1.critical_mellin_eq_fourier_scaled_v1' evidence-krein/overlay.log
          grep -F 'AEGIS.RHKreinCriticalLineBridgeV1.autocorrelation_mellin_critical_normSq_v1' evidence-krein/overlay.log

      - name: Compile density dependency for the fixed-packet criterion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/FormalConjectures/Millennium
          lake env lean -o .lake/build/lib/lean/FormalConjectures/Millennium/RHSnowflakeLog23.olean FormalConjectures/Millennium/RHSnowflakeLog23.lean 2>&1 | tee evidence-krein/snowflake.log
          python3 scripts/verify_rh_overlay_axioms.py FormalConjectures/Millennium/RHSnowflakeLog23.lean evidence-krein/snowflake.log

      - name: Compile and audit certified approximation and spectral obstruction
        shell: bash
        run: |
          set -euo pipefail
          result=0
          mkdir -p .lake/build/lib/lean/AEGISOverlay
          for m in RHKreinFiniteIntervalKernelV1 RHKreinFourierTaylorBoundV1 RHKreinFiniteCertificateDataV1 RHMultiGeneratorComplementarityV1 RHPrimePowerBoundedV1 RHBoundedConvolutionV1 RHPrimePowerKernelConnectorV1 RHBoxFourierComplementarityV1 RHKreinSplineSupportV1 RHKreinSplineContinuityV1 RHKreinSplineFourierIntegrableV1 RHKreinSplineDerivativesV1 RHKreinDigammaLowerBoundV1 RHKreinDigammaMonotonicityV1 RHGenericSpectralShiftV1 RHCompactMellinEntireV1 RHWeilTiltComplementarityV1 RHDetectingPacketV1; do
            if ! lake env lean -o ".lake/build/lib/lean/AEGISOverlay/$m.olean" "AEGISOverlay/$m.lean" 2>&1 | tee "evidence-krein/$m.log"; then result=1; fi
            if ! python3 scripts/verify_rh_overlay_axioms.py "AEGISOverlay/$m.lean" "evidence-krein/$m.log"; then result=1; fi
          done
          for m in RHCertifiedApproximationV1 RHTranslateSpectralObstructionV1 RHMultiGeneratorMellinObstructionV1 RHLocalMomentCorrectionV1 RHLocalKreinPartitionV1 RHKreinSymbolIntegrationV1 RHKreinPrimeSymbolV1 RHKreinFourierFactorV1 RHKreinCertificateTransferV1 RHKreinGenuineCertificateV1 RHKreinExplicitCorrectionV1 RHKreinM8CertificateV1 RHKreinCorrectionTaylorBridgeV1 RHKreinRationalCertificateV1 RHKreinFiniteCertificateAssemblyV1 RHGlobalGrowthBoundaryV1 RHGlobalPrimeArchFrontierV1 RHFixedPacketFourPhaseV1 RHDetectingPacketCriterionV1 RHFixedPacketFrontierV1 RHKernelSubexponentialV1 RHSubexpBoundedPerturbationV1 RHFixedPacketEventualTailV1 RHPrimeOnlyGrowthBridgeV1 RHFixedPacketDenseShiftV1 RHPrimeOnlyReflectedBridgeV2 RHPrimeOnlyReflectedTailV3 RHPrimeDiscrepancyLogSubstitutionV4 RHSignedPrimeActualKernelTailV5 RHWindowSevenOver32V1 WeilPrimeReindexV1 WeilAutocorrelationPrimeNormalFormV1 RHWindow693Over2000V1; do
            cp "AEGISOverlay/$m.lean" "$m.lean"
            if ! lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "evidence-krein/$m.log"; then result=1; fi
            if ! python3 scripts/verify_rh_overlay_axioms.py "AEGISOverlay/$m.lean" "evidence-krein/$m.log"; then result=1; fi
          done
          # Source PR #12 unchanged; replay it against this exact main-root source closure.
          # The join imports the existing near-log-two theorem and restricted-Weil gate.
          for m in RHSmallWindowProducerV1 RHSmallWindowCanonicalJoinV1; do
            cp "AegisRH/SmallWindow/$m.lean" "$m.lean"
            if ! lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "evidence-krein/$m.log"; then result=1; fi
            if ! python3 scripts/verify_rh_overlay_axioms.py "AegisRH/SmallWindow/$m.lean" "evidence-krein/$m.log"; then result=1; fi
          done
          if ! python3 scripts/verify_rh_overlay_axioms.py AEGISOverlay/RHKreinCriticalLineBridgeV1.lean evidence-krein/overlay.log; then result=1; fi
          git rev-parse HEAD > evidence-krein/formal-conjectures-sha.txt
          git -C .aegis rev-parse HEAD > evidence-krein/aegis-sha.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence-krein/mathlib-sha.txt
          lean --version > evidence-krein/lean-version.txt
          exit "$result"

      - name: Compile exact archived Abel and Chebyshev V6 join
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-krein .lake/build/lib/lean
          archive=research/rh/integration/AEGIS_PR63_ARCHIVED_ABEL_SOURCES_V6.tar.gz
          printf '%s  %s\n' dafcf849489f9b5f5ed7275ca74c53e4d0e6740d14bddbe51b62332d79a40801 "$archive" | sha256sum -c -
          test "$(tar -tzf "$archive" | wc -l)" -eq 4
          tar -xzf "$archive" -C .
          cat > evidence-krein/abel-source-lock.txt <<'PINS'
          WeilSignedPrimeFiniteSupportV1 5800bea6ca4468c8ea2f028738cadda1f818bc0e
          WeilPrimeAbelReductionV1 10ebac3a041ca87840e18aca521a93790f647a20
          WeilPrimeDiscrepancyV1 9d43fb9bd3b7bca72c94ab76eb604fde2d0a9e36
          WeilPrimeDiscrepancyEstimateV1 a8a48cafc2bc2117e2c7836abdbdf3eef4884600
          PINS
          while read -r m expected_blob; do
            test "$(git hash-object "$m.lean")" = "$expected_blob"
            echo "=== ARCHIVED ABEL $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "evidence-krein/$m-abel.log"
            ! grep -F 'sorryAx' "evidence-krein/$m-abel.log"
            ! grep -F 'error:' "evidence-krein/$m-abel.log"
          done < evidence-krein/abel-source-lock.txt
          cp AEGISOverlay/RHSignedPrimeChebyshevFiniteBridgeV6.lean RHSignedPrimeChebyshevFiniteBridgeV6.lean
          lake env lean -o .lake/build/lib/lean/RHSignedPrimeChebyshevFiniteBridgeV6.olean RHSignedPrimeChebyshevFiniteBridgeV6.lean 2>&1 | tee evidence-krein/RHSignedPrimeChebyshevFiniteBridgeV6.log
          python3 scripts/verify_rh_overlay_axioms.py AEGISOverlay/RHSignedPrimeChebyshevFiniteBridgeV6.lean evidence-krein/RHSignedPrimeChebyshevFiniteBridgeV6.log

