name: RH Krein spline L1 derivative v1

on:
  pull_request:
    paths:
      - 'AEGISOverlay/RHKreinSplineL1DerivativeBoundV1.lean'
      - '.github/workflows/rh-krein-spline-l1-derivative-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  spline-l1-derivative:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      - name: Compile exact spline dependency chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/FormalConjectures/Millennium .lake/build/lib/lean/AEGISOverlay evidence-m8
          lake env lean -o .lake/build/lib/lean/FormalConjectures/Millennium/RHSnowflakeLog23.olean             FormalConjectures/Millennium/RHSnowflakeLog23.lean 2>&1 | tee evidence-m8/RHSnowflakeLog23.log
          for m in RHMultiGeneratorComplementarityV1 RHBoxFourierComplementarityV1 RHKreinSplineSupportV1 RHKreinSplineContinuityV1; do
            lake env lean -o ".lake/build/lib/lean/AEGISOverlay/$m.olean"               "AEGISOverlay/$m.lean" 2>&1 | tee "evidence-m8/$m.log"
          done

      - name: Compile moving-average derivative producer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/AEGISOverlay evidence-m8
          lake env lean -o .lake/build/lib/lean/AEGISOverlay/RHKreinSplineL1DerivativeBoundV1.olean             AEGISOverlay/RHKreinSplineL1DerivativeBoundV1.lean 2>&1 | tee evidence-m8/compile.log
          ! grep -F 'sorryAx' evidence-m8/compile.log
          ! grep -F 'error:' evidence-m8/compile.log
          grep -F 'AEGIS.RHKreinSplineL1DerivativeBoundV1.deriv_convolution_normalizedBox' evidence-m8/compile.log

      - name: Record exact-head receipt
        if: always()
        shell: bash
        run: |
          mkdir -p evidence-m8
          git rev-parse HEAD > evidence-m8/formal-conjectures-sha.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence-m8/mathlib-sha.txt || true
          lean --version > evidence-m8/lean-version.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-krein-spline-l1-derivative-${{ github.sha }}-${{ github.run_id }}
          path: evidence-m8/
          if-no-files-found: warn
          retention-days: 30
