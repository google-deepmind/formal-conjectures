name: Check formal_proof links

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.repository == 'google-deepmind/formal-conjectures'
    # The script reads the working tree and fetches public URLs; it makes no API calls.
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check that every formal_proof link resolves and anchors a declaration
        run: python scripts/check_formal_proof_links.py
