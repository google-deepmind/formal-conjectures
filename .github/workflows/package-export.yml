name: Package-backed export

on:
  pull_request:
    paths:
      - 'comparator/**'
      - 'FormalConjecturesTest/PackageExport.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/package-export.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-export-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'google-deepmind/formal-conjectures'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Build exporter, fixtures and compatible export dependency
        run: |
          cmp lean-toolchain comparator/verifier/lean-toolchain
          lake --wfail build export_problem FormalConjecturesTest.PackageExport
          lake -d comparator/verifier build lean4export/lean4export

      - name: Build pinned generator and unmodified verifier tools
        env:
          GENERATOR_REV: e611b55d7097b9de973cbe0cef0f0cfad66dbe92
          COMPARATOR_REV: deec4b96fc443f9d5c4dbf3dcfb148a95be76f21
          LANDRUN_REV: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          NANODA_REV: 05055695879dfebb6628a67da88ceca6cd6b0421
        run: |
          git clone https://github.com/williamjblair/lean-eval-generator "$RUNNER_TEMP/generator"
          git -C "$RUNNER_TEMP/generator" checkout "$GENERATOR_REV"
          (cd "$RUNNER_TEMP/generator" && lake --wfail build)
          git clone https://github.com/williamjblair/comparator "$RUNNER_TEMP/comparator"
          git -C "$RUNNER_TEMP/comparator" checkout "$COMPARATOR_REV"
          (cd "$RUNNER_TEMP/comparator" && lake build comparator)
          git clone https://github.com/Zouuup/landrun "$RUNNER_TEMP/landrun"
          git -C "$RUNNER_TEMP/landrun" checkout "$LANDRUN_REV"
          (cd "$RUNNER_TEMP/landrun" && go build -o landrun ./cmd/landrun)
          git clone https://github.com/ammkrn/nanoda_lib "$RUNNER_TEMP/nanoda"
          git -C "$RUNNER_TEMP/nanoda" checkout "$NANODA_REV"
          (cd "$RUNNER_TEMP/nanoda" && cargo build --release)

      - name: Check fresh Git dependencies, sandbox and both kernels
        env:
          FC_SOURCE_REPOSITORY: https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
        run: |
          sudo systemd-run --wait --pipe --collect \
            --property="User=$(id -un)" \
            --property='RestrictAddressFamilies=~AF_UNIX' \
            --working-directory="$GITHUB_WORKSPACE" \
            --setenv="PATH=$PATH" \
            --setenv="FC_SOURCE_REPOSITORY=$FC_SOURCE_REPOSITORY" \
            --setenv="LEAN_EVAL_GENERATOR_CHECKOUT=$RUNNER_TEMP/generator" \
            --setenv="COMPARATOR_RESULTS_DIR=$RUNNER_TEMP/comparator-results" \
            --setenv="COMPARATOR_BIN=$RUNNER_TEMP/comparator/.lake/build/bin/comparator" \
            --setenv="COMPARATOR_LEAN4EXPORT=$GITHUB_WORKSPACE/comparator/verifier/.lake/packages/lean4export/.lake/build/bin/lean4export" \
            --setenv="COMPARATOR_LANDRUN=$RUNNER_TEMP/landrun/landrun" \
            --setenv="COMPARATOR_NANODA=$RUNNER_TEMP/nanoda/target/release/nanoda_bin" \
            python3 -m unittest discover -s comparator -p test_export.py -v

      - name: Export the complete FC100 subset
        run: |
          python3 comparator/check_coverage.py --generator "$RUNNER_TEMP/generator" --out "$RUNNER_TEMP/fc100"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: export-qualification
          path: |
            ${{ runner.temp }}/comparator-results
            ${{ runner.temp }}/fc100
          if-no-files-found: warn
