name: AEGIS RH Signed Four Block Reality Exact Replay

on:
  push:
    branches:
      - 'evidence/rh-signed-four-block-reality-360875-v1'
    paths:
      - '.github/workflows/rh-signed-four-block-reality-exact.yml'
      - 'AegisRH/SignedFour/**'
  pull_request:
    paths:
      - '.github/workflows/rh-signed-four-block-reality-exact.yml'
      - 'AegisRH/SignedFour/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-four-block-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  SOURCE_SHA: a7b94b2888fd5c47ec181b997547ac87a6fbcf60
  PARENT_SHA: 085a0a03af8f6676eeae678489bef3473c1f8fcc
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  TARGET_MODULE: RHSignedFourBlockRealityV1

jobs:
  verify:
    name: exact signed-four-block reality replay
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false

      - name: Checkout candidate compatibility overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .fork-compat
          persist-credentials: false

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact source lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C .aegis rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          test -f ".aegis/sovereign-omega-v2/formal/bridges/lean/$TARGET_MODULE.lean"

      - name: Replay exact rational signed threshold preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 .aegis/research/rh/signed_four_block_preflight_v1.py | tee signed-four-block-preflight.json
          python3 - <<'PY'
          import json
          d=json.load(open("signed-four-block-preflight.json",encoding="utf-8"))
          assert d["all_ones_rayleigh_lower"] == {"numerator":46617,"denominator":40000}
          assert d["old_certificate_gap"] == {"numerator":5417,"denominator":40000}
          assert d["old_certificate_sufficient"] is False
          assert d["old_comparison_ldlt_pivots"] == [
              {"numerator":-103,"denominator":100},
              {"numerator":-2002,"denominator":2575},
              {"numerator":-236161,"denominator":800800},
              {"numerator":14004033,"denominator":4723220},
          ]
          assert d["old_comparison_inertia"] == [1,3,0]
          assert d["narrow_comparison_ldlt_pivots"] == [
              {"numerator":-32,"denominator":25},
              {"numerator":-13783,"denominator":12800},
              {"numerator":-269534,"denominator":344575},
              {"numerator":-82023,"denominator":1134880},
          ]
          assert d["narrow_comparison_inertia"] == [0,4,0]
          print("SIGNED_FOUR_BLOCK_103_OVER_100_NO_GO=PASS")
          print("SIGNED_FOUR_BLOCK_COMPARISON_INERTIA=PASS")
          PY

      - name: Obtain exact Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version | tee lean-version.log

      - name: Compute target import closure
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          python3 - "$ROOT" "$TARGET_MODULE" "$GITHUB_WORKSPACE/module-order.txt" <<'PY'
          import pathlib, sys
          root=pathlib.Path(sys.argv[1])
          target=sys.argv[2]
          out=pathlib.Path(sys.argv[3])
          mods={p.stem:p for p in root.glob("*.lean")}
          if target not in mods:
              raise SystemExit("TARGET_MODULE_MISSING")
          deps={}
          for name,path in mods.items():
              ds=[]
              for line in path.read_text(encoding="utf-8").splitlines():
                  s=line.split("--",1)[0].strip()
                  if not s.startswith("import "):
                      continue
                  for tok in s[7:].split():
                      dep=tok.split(".")[0]
                      if dep in mods:
                          ds.append(dep)
              deps[name]=ds
          seen=set(); temp=set(); order=[]
          def visit(m):
              if m in seen: return
              if m in temp: raise SystemExit("IMPORT_CYCLE:"+m)
              temp.add(m)
              for d in deps[m]: visit(d)
              temp.remove(m); seen.add(m); order.append(m)
          visit(target)
          out.write_text("\n".join(order)+"\n",encoding="utf-8")
          print("SIGNED_FOUR_BLOCK_CLOSURE_COUNT",len(order))
          print("\n".join(order))
          PY

      - name: Bind and apply packet compatibility overlay
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          FILE="$ROOT/RHFineMomentPacketV3.lean"
          test "$(git -C .aegis hash-object sovereign-omega-v2/formal/bridges/lean/RHFineMomentPacketV3.lean)" = "27de7445fa119b5616acff8bfca00689a8bf3f10"
          mkdir -p evidence
          sha256sum "$FILE" > evidence/packet-original-sha256.txt
          cp .fork-compat/AegisRH/SignedFour/Compat/RHFineMomentPacketV3.lean "$FILE"
          sha256sum "$FILE" > evidence/packet-compiled-sha256.txt
          git -C .fork-compat rev-parse HEAD > evidence/compat-head.txt

      - name: Bind and apply exact signed-four reality proof repair
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          FILE="$ROOT/RHSignedFourBlockRealityV1.lean"
          test "$(git -C .aegis hash-object sovereign-omega-v2/formal/bridges/lean/RHSignedFourBlockRealityV1.lean)" = "3939248d9f5d477c094076f075bf94c5f26e18fd"
          sha256sum "$FILE" > evidence/signed-reality-source-sha256.txt
          cp .fork-compat/AegisRH/SignedFour/Compat/RHSignedFourBlockRealityV1.lean "$FILE"
          sha256sum "$FILE" > evidence/signed-reality-compiled-sha256.txt

      - name: Compile exact target closure
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/signed-four-block"
          mkdir -p "$OUT" evidence
          BASE_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$ROOT:$BASE_LEAN_PATH"
          : > evidence/source-sha256.txt
          while IFS= read -r m; do
            test -n "$m"
            f="$ROOT/$m.lean"
            sha256sum "$f" >> evidence/source-sha256.txt
            echo "=== COMPILE $m ==="
            lean -o "$OUT/$m.olean" "$f" 2>&1 | tee "evidence/$m.log"
          done < module-order.txt

      - name: Audit signed reality theorems
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/signed-four-block"
          export LEAN_PATH="$OUT:$ROOT:$(lake env printenv LEAN_PATH)"
          cat > /tmp/SignedFourBlockRealityAudit.lean <<'LEAN'
          import RHSignedFourBlockRealityV1
          #print axioms AEGIS.RHSignedFourBlockRealityV1.gFine_real_v1
          #print axioms AEGIS.RHSignedFourBlockRealityV1.mixed_real_v1
          #print axioms AEGIS.RHSignedFourBlockRealityV1.explicitRightSide_real_v1
          #print axioms AEGIS.RHSignedFourBlockRealityV1.B_real_of_real_packets_v1
          #print axioms AEGIS.RHSignedFourBlockRealityV1.gFine_B_eq_real_gap_v1
          #print axioms AEGIS.RHSignedFourBlockRealityV1.dyadic_B_toeplitz_v1
          LEAN
          lean /tmp/SignedFourBlockRealityAudit.lean 2>&1 | tee evidence/axioms.log
          ! grep -F 'sorryAx' evidence/axioms.log

      - name: Emit disposition
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/DISPOSITION.txt <<EOF
          SOURCE_SHA=$SOURCE_SHA
          PARENT_SHA=$PARENT_SHA
          TARGET_MODULE=$TARGET_MODULE
          SOURCE_BYTES_PRESERVED=FALSE
          COMPATIBILITY_OVERLAY=SOURCE_BOUND_RHFineMomentPacketV3_AND_RHSignedFourBlockRealityV1
          CLAIM=REAL_SYMMETRIC_TOEPLITZ_REDUCTION_FOR_GFINE_DYADIC_B
          COMPARISON_SCHUR_INERTIA=EXACT_RATIONAL_RECEIPT
          GLOBAL_WEIL_SIGN=NOT_CLAIMED
          RH=NOT_CLAIMED
          AUTHORITY_EFFECT=NONE
          EOF

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-signed-four-block-reality-360875
          path: |
            evidence/
            module-order.txt
            lean-version.log
          if-no-files-found: warn
          retention-days: 30
