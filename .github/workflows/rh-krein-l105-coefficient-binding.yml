name: AEGIS RH L105 Source-Exact Coefficient Binding

on:
  push:
    branches:
      - 'integration/rh-proof-spine-main-root-v1'
    paths:
      - 'research/rh/krein_L105_v1/tools/**'
      - '.github/workflows/rh-krein-l105-coefficient-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-rebind:
    name: validate 399 hat plus 5 delta dyadic inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact fork HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify pinned source and generators
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p evidence-l105
          test "$(git hash-object research/rh/krein_L105_v1/RHKreinL105DataV1.lean)" = 1b88c253ed33ab041880bc0cd3c117d1d2e09e34
          test "$(git hash-object research/rh/aegis_source_4d7578e/research/krein_lp_L1.05_svd.json)" = 8693c140b4be1f785074aa7040b5c50be5ef5fd2
          test "$(git hash-object research/rh/krein_L105_v1/tools/m105.py)" = edb52a548ea8befa22ba155553c175bd721ea756
          test "$(git hash-object research/rh/krein_L105_v1/tools/gen105.py)" = 3f283411bb216bd79099600dd4945c74b5e8eff6
          test "$(git hash-object research/rh/krein_L105_v1/tools/genall105.py)" = f3769a0b5b34a0c10f167a5782970d772d2de974
          test "$(git hash-object research/rh/krein_L105_v1/tools/resplit.py)" = 5107d8e04454e814bd9a897b17876ae46d36c523
          test "$(git hash-object research/rh/krein_L105_v1/tools/sweep.py)" = ed523d5040912814843f6028d7a576c28fca32c8
          test "$(git hash-object research/rh/krein_L105_v1/tools/minN.py)" = 1f34cdd274ad09fb7f58818733258721bf817ddd
          test "$(git hash-object research/rh/krein_L105_v1/tools/deg16.py)" = fc93a9781c89103418a558c06d5382eea9c9b047
          printf 'EXACT_HEAD=%s\nLEAN_DATA_BLOB=1b88c253ed33ab041880bc0cd3c117d1d2e09e34\nJSON_BLOB=8693c140b4be1f785074aa7040b5c50be5ef5fd2\n' "$GITHUB_SHA" > evidence-l105/source.txt
      - name: Run exact dyadic binding test without Lean or extra mathematical assumptions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/rh/krein_L105_v1/tools/{m105,gen105,genall105,resplit}.py
          python3 - <<'PY' | tee evidence-l105/coefficients.log
          from pathlib import Path
          from fractions import Fraction
          import sys,re
          project=Path.cwd()
          root=project/'research/rh/krein_L105_v1'
          sys.path.insert(0,str(root/'tools'))
          import m105
          source=(root/'RHKreinL105DataV1.lean').read_text()
          def read_pairs(key,next_key):
            i=source.index('def '+key+' ')
            j=source.index('def '+next_key+' ',i)
            pairs=re.findall(r'\((-?\d+),\s*(\d+)\)',source[i:j])
            return [Fraction(int(a),2**int(b)) for a,b in pairs]
          hat=read_pairs('cqRaw','dqRaw')
          delta=read_pairs('dqRaw','cqList')
          assert len(hat)==399,('HAT_COUNT',len(hat))
          assert len(delta)==5,('DELTA_COUNT',len(delta))
          assert m105.CQ==hat, 'HAT_BYTES_NOT_MATHEMATICALLY_IDENTICAL'
          assert m105.DQ==delta, 'DELTA_BYTES_NOT_MATHEMATICALLY_IDENTICAL'
          assert m105.NH==399
          assert len(m105._P['coef'])==404
          print('SOURCE_EXACT_COEFFICIENT_BINDING=PASS')
          print('DYADIC_EQUALITY=404_OF_404')
          print('HAT_COLUMNS=399')
          print('DELTA_TERMS=5')
          print('KREIN_21_OVER_20_KERNEL_REPLAY=NOT_RUN')
          print('RIEMANN_HYPOTHESIS=NOT_PROVED')
          PY
      - name: Check generator location independence using disposable non-proof fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys, tempfile, shutil
          from pathlib import Path
          original = Path.cwd() / 'research/rh/krein_L105_v1/tools'
          with tempfile.TemporaryDirectory(prefix='aegis-l105-generator-smoke-') as temp:
              root = Path(temp)
              tools = root / 'tools'
              tools.mkdir()
              for name in ('gen105.py', 'genall105.py'):
                  shutil.copy2(original / name, tools / name)
              (root / 'RHKreinHatAtV1.lean').write_text('/-\nTEST FIXTURE ONLY; NOT A PROOF\n-/\n')
              fixture = [
                  {'lo':'0','hi':'1500','N':16,'K0':0,'deg':36,'hats':True,'breaks':['1500']},
                  {'lo':'1500','hi':'3000','N':16,'K0':0,'deg':16,'hats':False,'breaks':['3000']}
              ]
              (tools / 'design105F.json').write_text(json.dumps(fixture))
              # Execute from outside the generator and certificate directories.
              for name in ('gen105.py', 'genall105.py'):
                  subprocess.run([sys.executable, str(tools / name)], cwd=Path(temp).parent,
                                 check=True, capture_output=True, text=True)
              batches=json.loads((tools/'batches105.json').read_text())
              assert batches==[['RHKreinL105Batch000',[0,1]]], batches
              assert (root/'RHKreinL105Batch000.lean').is_file()
              assert (root/'RHKreinL105AllV1.lean').is_file()
              # The second fixture has a gap; it MUST be rejected before any proof-generation.
              fixture[1]['lo']='1501'
              (tools/'design105F.json').write_text(json.dumps(fixture))
              proc=subprocess.run([sys.executable,str(tools/'gen105.py')],cwd=Path(temp).parent,
                                  capture_output=True,text=True)
              assert proc.returncode != 0
              assert 'L105_NONCONTIGUOUS_WINDOW_1' in proc.stderr
          print('GENERATOR_PATH_SMOKE=PASS')
          print('DISCONTINUOUS_DESIGN_REJECTED=PASS')
          print('REAL_L105_BATCH_KERNEL_REPLAY=NOT_RUN')
          PY
      - name: Reconstruct exact L105 design and generated batch sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/research/rh/krein_L105_v1"
          TOOLS="$ROOT/tools"
          mkdir -p evidence-l105/generated
          python3 "$TOOLS/sweep.py" | tee evidence-l105/sweep.log
          python3 "$TOOLS/minN.py" | tee evidence-l105/minN.log
          python3 "$TOOLS/deg16.py" | tee evidence-l105/deg16.log
          python3 "$TOOLS/gen105.py" 200 | tee evidence-l105/gen105.log
          python3 "$TOOLS/genall105.py" | tee evidence-l105/genall105.log
          python3 - <<'PY' | tee evidence-l105/reconstruction-summary.txt
          import json
          from pathlib import Path
          root=Path("research/rh/krein_L105_v1")
          tools=root/"tools"
          design=json.loads((tools/"design105F.json").read_text(encoding="utf-8"))
          batches=json.loads((tools/"batches105.json").read_text(encoding="utf-8"))
          pieces=sum(len(c["breaks"]) for c in design)
          hats=sum(bool(c["hats"]) for c in design)
          assert len(design)==1744, len(design)
          assert pieces==4517, pieces
          assert hats==170, hats
          assert design[0]["lo"]=="0" and design[-1]["hi"]=="3000"
          assert len(batches)==116, len(batches)
          assert all(name == f"RHKreinL105Batch{i:03d}" and ids for i,(name,ids) in enumerate(batches))
          files=sorted(root.glob("RHKreinL105Batch[0-9][0-9][0-9].lean"))
          assert len(files)==116, len(files)
          assert (root/"RHKreinL105AllV1.lean").is_file()
          print("DESIGN105F_RECONSTRUCTION=PASS")
          print("CELLS=1744")
          print("PIECES=4517")
          print("HAT_CELLS=170")
          print("BATCH_MODULES=116")
          print("FINITE_CERTIFICATE_SOURCE=RECONSTRUCTED_AT_EXACT_HEAD")
          print("REAL_L105_BATCH_KERNEL_REPLAY=NOT_RUN")
          print("WINDOWS_L_GE_21_OVER_40=OPEN")
          print("RIEMANN_HYPOTHESIS=NOT_PROVED")
          PY
          git rev-parse HEAD > evidence-l105/generated/exact-head.txt
          sha256sum "$TOOLS/design105F.json" "$TOOLS/batches105.json" "$ROOT"/RHKreinL105Batch[0-9][0-9][0-9].lean "$ROOT/RHKreinL105AllV1.lean" |
            sort > evidence-l105/generated/source-sha256.txt
          cp "$TOOLS/design105F.json" "$TOOLS/batches105.json" evidence-l105/generated/
          cp "$ROOT"/RHKreinL105Batch[0-9][0-9][0-9].lean "$ROOT/RHKreinL105AllV1.lean" evidence-l105/generated/

      - name: Record known missing finite certificate design without inventing data
        if: always()
        shell: bash
        run: |
          if git ls-files --error-unmatch research/rh/krein_L105_v1/tools/design105F.json >/dev/null 2>&1; then
            echo 'DESIGN105F=SOURCE_PRESENT' > evidence-l105/design-status.txt
          elif test -f research/rh/krein_L105_v1/tools/design105F.json; then
            echo 'DESIGN105F=RECONSTRUCTED_AT_EXACT_HEAD' > evidence-l105/design-status.txt
          else
            echo 'DESIGN105F=NOT_RECONSTRUCTED' > evidence-l105/design-status.txt
          fi
          if test -f research/rh/krein_L105_v1/RHKreinL105AllV1.lean; then
            echo 'L105_ASSEMBLY_SOURCE=PRESENT' >> evidence-l105/design-status.txt
          fi
          printf 'WINDOWS_L_GE_21_OVER_40=OPEN\nPROTECTED_MAIN_ADMISSION=NOT_EXECUTED\n' >> evidence-l105/design-status.txt
      - name: Upload machine-checkable data receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-l105-coefficient-binding-${{ github.sha }}
          path: evidence-l105/
          if-no-files-found: warn
          retention-days: 30


  kernel-replay:
    name: replay reconstructed L105 modules in Lean 4.33.1
    needs: data-rebind
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact fork HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact AEGIS base and window dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: 2c3d041b633147ec97c7ef753aa9d157a47bb9f5
          path: .aegis-window
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact AEGIS base closure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: cfe368ce2ffa0d196a4319c02b956997edf9f3fa
          path: .aegis-base
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout pinned Li/Hadamard zero-counting provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
          path: .li-l105
          fetch-depth: 1
          persist-credentials: false
      - name: Download generated exact-head certificate sources
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rh-l105-coefficient-binding-${{ github.sha }}
          path: evidence-l105
      - name: Verify pins and materialize source-only AEGIS modules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .aegis-window rev-parse HEAD)" = "2c3d041b633147ec97c7ef753aa9d157a47bb9f5"
          test "$(git -C .aegis-base rev-parse HEAD)" = "cfe368ce2ffa0d196a4319c02b956997edf9f3fa"
          mkdir -p .lake/l105-generated .lake/l105-source evidence-l105/replay
          cp evidence-l105/generated/RHKreinL105Batch[0-9][0-9][0-9].lean .lake/l105-generated/
          cp evidence-l105/generated/RHKreinL105AllV1.lean .lake/l105-generated/
          for source_root in \
            research/rh/aegis_source_4d7578e/lean \
            research/rh/aegis_source_4f93fff/lean
          do
            for source in "$source_root"/*.lean.src; do
              cp "$source" ".lake/l105-source/$(basename "$source" .src)"
            done
          done
          printf 'EXACT_HEAD=%s\nAEGIS_WINDOW=2c3d041b633147ec97c7ef753aa9d157a47bb9f5\nAEGIS_BASE=cfe368ce2ffa0d196a4319c02b956997edf9f3fa\n' "$GITHUB_SHA" > evidence-l105/replay/pins.txt
      - name: Install pinned Lean 4.33.1 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.33.1"
          grep -Fq "0df444a360eaa60ab8c11dca51a86af692955474" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "0df444a360eaa60ab8c11dca51a86af692955474"
          lean --version | tee evidence-l105/replay/lean-version.txt
      - name: Restore exact Li/Hadamard provider build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li-l105/.lake/build
          key: rh-li-provider-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-35df682f3b709ffe5fbcfdd452dfa964bd622b87-0df444a360eaa60ab8c11dca51a86af692955474-10d38a54580ff72d698a30be64fe1c3c44f862a2
      - name: Bind and build pinned Li/Hadamard zero-counting provider
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .li-l105 rev-parse HEAD)" = "35df682f3b709ffe5fbcfdd452dfa964bd622b87"
          test "$(git -C .li-l105 hash-object Hadamard/General/Factorization.lean)" = "10d38a54580ff72d698a30be64fe1c3c44f862a2"
          printf 'leanprover/lean4:v4.33.1\n' > .li-l105/lean-toolchain
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.li-l105')
          p=root/'lakefile.lean'
          old='de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11'
          new='0df444a360eaa60ab8c11dca51a86af692955474'
          original=p.read_text(encoding='utf-8')
          assert original.count(old)==1, 'L105_LI_MATHLIB_PIN_MISMATCH'
          p.write_text(original.replace(old,new,1),encoding='utf-8')
          q=root/'Hadamard/General/Factorization.lean'
          source=q.read_text(encoding='utf-8')
          for before,after in [
            ('eventually_nhdsWithin_of_forall fun w hw => ite_eq_right hw',
             'eventually_nhdsWithin_of_forall fun w hw => if_neg hw'),
            ('have hgz : g z = Q z := ite_eq_left rfl',
             'have hgz : g z = Q z := by simp [g]'),
            ('rw [ite_eq_right heq, hQ_eq_div z (hz heq)]',
             'rw [if_neg heq, hQ_eq_div z (hz heq)]'),
          ]:
              assert source.count(before)==1, 'L105_LI_COMPAT_SOURCE_MISMATCH'
              source=source.replace(before,after,1)
          q.write_text(source,encoding='utf-8')
          PY
          rm -f .li-l105/lake-manifest.json
          (
            cd .li-l105
            lake update mathlib
            lake exe cache get
            test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "0df444a360eaa60ab8c11dca51a86af692955474"
            lake build Hadamard.OrderOne.TailEstimates Hadamard.OrderOne.LogDerivMultiplicity \
              Lc.LiCriterion.XiGrowth Lc.LiCriterion.HadamardSummabilityBridge \
              Lc.LiCriterion.HadamardBridge
          )
          for module in Hadamard/OrderOne/TailEstimates Lc/LiCriterion/XiGrowth Lc/LiCriterion/HadamardSummabilityBridge; do
            test -s ".li-l105/.lake/build/lib/lean/$module.olean" || {
              echo "L105_PROVIDER_OLEAN_MISSING:$module" >&2; exit 1;
            }
          done
          mkdir -p .lake/l105-build
          cp -a .li-l105/.lake/build/lib/lean/. .lake/l105-build/
          printf 'LI_PROVIDER_SHA=35df682f3b709ffe5fbcfdd452dfa964bd622b87\nLI_PROVIDER_SOURCE_BLOB=10d38a54580ff72d698a30be64fe1c3c44f862a2\nMATHLIB_SHA=0df444a360eaa60ab8c11dca51a86af692955474\n' >> evidence-l105/replay/pins.txt
      - name: Compute and compile exact L105 dependency closure
        shell: bash
        run: |
          set -euo pipefail
          GEN="$GITHUB_WORKSPACE/.lake/l105-generated"
          L105="$GITHUB_WORKSPACE/research/rh/krein_L105_v1"
          REFLECTIVE="$GITHUB_WORKSPACE/research/rh/krein_reflective_v1"
          OVERLAY="$GITHUB_WORKSPACE/AEGISOverlay"
          SRC="$GITHUB_WORKSPACE/AegisRH/PR606/Source"
          COMPAT="$GITHUB_WORKSPACE/AegisRH/PR606/Compat"
          L105SRC="$GITHUB_WORKSPACE/.lake/l105-source"
          WIN="$GITHUB_WORKSPACE/.aegis-window/sovereign-omega-v2/formal/bridges/lean"
          BASE="$GITHUB_WORKSPACE/.aegis-base/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/l105-build"
          mkdir -p "$OUT"
          ROOT_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$GITHUB_WORKSPACE:$GEN:$L105:$REFLECTIVE:$OVERLAY:$SRC:$COMPAT:$L105SRC:$WIN:$BASE:$ROOT_LEAN_PATH"
          export GEN L105 REFLECTIVE OVERLAY SRC COMPAT L105SRC WIN BASE OUT
          python3 - <<'PY'
          from pathlib import Path
          import os, sys
          roots=[Path(os.environ[k]) for k in
                 ("BASE","WIN","L105SRC","SRC","COMPAT","OVERLAY","REFLECTIVE","L105","GEN")]
          modules={}
          for root in roots:
              for p in root.rglob("*.lean"):
                  modules[p.stem]=p
          skip={"Mathlib","Lean","Std","Aesop","Batteries","Qq","Lc","Hadamard","FormalConjectures"}
          import_spellings={}
          def imported_names(path):
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line=raw.split("--",1)[0].strip()
                  if not line.startswith("import "):
                      continue
                  for token in line[7:].split():
                      top=token.split(".",1)[0]
                      if top in skip:
                          continue
                      name=token.split(".")[-1]
                      if name in modules:
                          previous=import_spellings.get(name)
                          if previous is not None and previous != token:
                              raise SystemExit(f"L105_IMPORT_ALIAS_CONFLICT:{name}:{previous}:{token}")
                          import_spellings[name]=token
                          yield name
                      else:
                          raise SystemExit(f"L105_IMPORT_UNRESOLVED:{path.name}:{token}")
          seen=set()
          active=set()
          order=[]
          def visit(name):
              if name in seen:
                  return
              if name in active:
                  raise SystemExit(f"L105_IMPORT_CYCLE:{name}")
              if name not in modules:
                  raise SystemExit(f"L105_MODULE_UNRESOLVED:{name}")
              active.add(name)
              for dep in imported_names(modules[name]):
                  visit(dep)
              active.remove(name)
              seen.add(name)
              order.append(name)
          visit("RHWindowL105FinalV1")
          order_path=Path(".lake/l105-order.txt")
          order_path.write_text("\n".join(f"{n}\t{import_spellings.get(n,n).replace('.', '/')}\t{modules[n]}" for n in order)+"\n",encoding="utf-8")
          print("L105_CLOSURE_COUNT",len(order))
          print("L105_TARGET",modules["RHWindowL105FinalV1"])
          PY
          while IFS="$(printf '\t')" read -r name module_path file; do
            test -n "$name" || continue
            test -n "$module_path" || { echo "L105_IMPORT_NAME_MISSING:$name" >&2; exit 1; }
            echo "=== L105 $name [$module_path] ==="
            # Emit exactly where Lean resolves the actual import spelling.
            olean="$OUT/$module_path.olean"
            mkdir -p "$(dirname "$olean")"
            lean -o "$olean" "$file" 2>&1 | tee "evidence-l105/replay/$name.log"
            test -s "$olean" || { echo "L105_OLEAN_MISSING:$olean" >&2; exit 1; }
          done < .lake/l105-order.txt
          ! grep -R -n -E 'sorryAx|declaration uses .sorry.' evidence-l105/replay
      - name: Audit exact L105 theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          GEN="$GITHUB_WORKSPACE/.lake/l105-generated"
          L105="$GITHUB_WORKSPACE/research/rh/krein_L105_v1"
          REFLECTIVE="$GITHUB_WORKSPACE/research/rh/krein_reflective_v1"
          OVERLAY="$GITHUB_WORKSPACE/AEGISOverlay"
          SRC="$GITHUB_WORKSPACE/AegisRH/PR606/Source"
          COMPAT="$GITHUB_WORKSPACE/AegisRH/PR606/Compat"
          L105SRC="$GITHUB_WORKSPACE/.lake/l105-source"
          WIN="$GITHUB_WORKSPACE/.aegis-window/sovereign-omega-v2/formal/bridges/lean"
          BASE="$GITHUB_WORKSPACE/.aegis-base/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/l105-build"
          ROOT_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$GITHUB_WORKSPACE:$GEN:$L105:$REFLECTIVE:$OVERLAY:$SRC:$COMPAT:$L105SRC:$WIN:$BASE:$ROOT_LEAN_PATH"
          cat > /tmp/RHL105Axioms.lean <<'LEAN'
          import RHWindowL105FinalV1
          #print axioms AEGIS.RHKreinL105AllV1.zero_quadratic_nonneg_width_21_20
          #print axioms AEGIS.RHWindowL105FinalV1.window_lt_21_40
          #print axioms AEGIS.RHWindowL105FinalV1.rh_of_windows_from_21_40
          LEAN
          lean /tmp/RHL105Axioms.lean 2>&1 | tee evidence-l105/replay/axioms.log
          ! grep -F 'sorryAx' evidence-l105/replay/axioms.log
          printf 'L105_BATCH_KERNEL_REPLAY=PASS\nWINDOW_LT_21_OVER_40=PROVED\nWINDOWS_L_GE_21_OVER_40=OPEN\nRIEMANN_HYPOTHESIS=NOT_PROVED\n' > evidence-l105/replay/disposition.txt
      - name: Upload exact-head L105 kernel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-l105-kernel-replay-${{ github.sha }}-${{ github.run_id }}
          path: evidence-l105/replay/
          if-no-files-found: warn
          retention-days: 30
