name: AEGIS RH DeepMind Target Direct V1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - 'proof/rh-deepmind-target-direct-replay-v2'
    paths:
      - 'AegisRH/PR606/**'
      - 'FormalConjectures/Millennium/RiemannHypothesis.lean'
      - '.github/workflows/aegis-rh-deepmind-target-direct-v1.yml'
  pull_request:
    paths:
      - 'AegisRH/PR606/**'
      - 'FormalConjectures/Millennium/RiemannHypothesis.lean'
      - '.github/workflows/aegis-rh-deepmind-target-direct-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_BASE_SHA: cfe368ce2ffa0d196a4319c02b956997edf9f3fa
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  UPSTREAM_RH_BLOB: 5b1dcd5c46ab4a5f449d7d4a5c5ddce7c89c3542
  LI_PROVIDER_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_PROVIDER_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  LI_FACTORIZATION_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2
  PORT_SOURCE_SHA: 357251d0e6ea64319357eb141776c0e3cdcd7311

jobs:
  direct-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact fork head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact PR606 fork source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tarikskalic33/formal-conjectures
          ref: ${{ env.PORT_SOURCE_SHA }}
          path: .port-source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact AEGIS base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_BASE_SHA }}
          path: .aegis-base
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Li provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_PROVIDER_SHA }}
          path: .li
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout certified 693/2000 window source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: 2c3d041b633147ec97c7ef753aa9d157a47bb9f5
          path: .aegis-window
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact environment pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -F "$MATHLIB_SHA" lake-manifest.json
          test "$(git -C .aegis-base rev-parse HEAD)" = "$AEGIS_BASE_SHA"
          test "$(git -C .port-source rev-parse HEAD)" = "$PORT_SOURCE_SHA"
          test "$(git -C .li rev-parse HEAD)" = "$LI_PROVIDER_SHA"
          test "$(git -C .li hash-object Hadamard/General/Factorization.lean)" = "$LI_FACTORIZATION_BLOB"
          test -f FormalConjectures/Millennium/RiemannHypothesis.lean
          grep -Fx 'import RHRestrictedWeilCriterionV13' FormalConjectures/Millennium/RiemannHypothesis.lean
          ! grep -n -A3 'theorem riemannHypothesis : RiemannHypothesis' FormalConjectures/Millennium/RiemannHypothesis.lean | grep -F 'sorry'

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version

      - name: Restore exact Li provider build
        id: li-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li/.lake/build
          key: li-provider-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}

      - name: Rebind and build exact Li provider
        if: steps.li-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd .li
          printf '%s\n' "$LEAN_TOOLCHAIN" > lean-toolchain
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('lakefile.lean')
          text=p.read_text(encoding='utf-8')
          old=os.environ['LI_PROVIDER_ORIGINAL_MATHLIB_SHA']
          new=os.environ['MATHLIB_SHA']
          assert text.count(old) == 1
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          q=Path('Hadamard/General/Factorization.lean')
          text=q.read_text(encoding='utf-8')
          replacements=[
            ('eventually_nhdsWithin_of_forall fun w hw => ite_eq_right hw',
             'eventually_nhdsWithin_of_forall fun w hw => if_neg hw'),
            ('have hgz : g z = Q z := ite_eq_left rfl',
             'have hgz : g z = Q z := by simp [g]'),
            ('rw [ite_eq_right heq, hQ_eq_div z (hz heq)]',
             'rw [if_neg heq, hQ_eq_div z (hz heq)]'),
          ]
          for old,new in replacements:
            if old in text:
              text=text.replace(old,new,1)
          q.write_text(text,encoding='utf-8')
          PY
          rm -f lake-manifest.json
          lake update mathlib
          lake exe cache get
          lake build \
            Hadamard.OrderOne.LogDerivMultiplicity \
            Lc.LiCriterion.XiGrowth \
            Lc.LiCriterion.HadamardSummabilityBridge \
            Lc.LiCriterion.HadamardBridge

      - name: Compute V13 terminal dependency closure
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/.aegis-base/sovereign-omega-v2/formal/bridges/lean"
          LOCAL="$GITHUB_WORKSPACE/AegisRH/PR606"
          SRC="$GITHUB_WORKSPACE/.port-source/AegisRH/PR606/Source"
          COMPAT="$GITHUB_WORKSPACE/.port-source/AegisRH/PR606/Compat"
          OUT="$GITHUB_WORKSPACE/.lake/deepmind-rh-target"
          mkdir -p "$OUT"

          python3 - "$BASE" "$LOCAL" "$SRC" "$COMPAT" "$GITHUB_WORKSPACE/.deepmind-rh-order.txt" <<'PY'
          import pathlib, sys
          base=pathlib.Path(sys.argv[1])
          local=pathlib.Path(sys.argv[2])
          src=pathlib.Path(sys.argv[3])
          compat=pathlib.Path(sys.argv[4])
          out=pathlib.Path(sys.argv[5])

          groups = [
              ("BASE", {p.stem:p for p in base.glob("*.lean")}),
              ("SRC", {p.stem:p for p in src.glob("*.lean")}),
              ("COMPAT", {p.stem:p for p in compat.glob("*.lean")}),
              ("LOCAL", {p.stem:p for p in local.glob("*.lean")}),
          ]
          mods=set()
          for _,g in groups: mods |= set(g)

          def selected(m):
              for _,g in reversed(groups):
                  if m in g: return g[m]
              raise SystemExit("missing:"+m)

          deps={}
          for m in mods:
              ds=[]
              for line in selected(m).read_text(encoding="utf-8").splitlines():
                  s=line.split("--",1)[0].strip()
                  if not s.startswith("import "): continue
                  for tok in s[7:].split():
                      root=tok.split(".")[0]
                      if root in mods: ds.append(root)
              deps[m]=ds

          target="RHRestrictedWeilCriterionV13"
          assert target in mods
          seen=set(); temp=set(); order=[]
          def visit(m):
              if m in seen: return
              if m in temp: raise SystemExit("cycle:"+m)
              temp.add(m)
              for d in deps[m]: visit(d)
              temp.remove(m); seen.add(m); order.append(m)
          visit(target)
          out.write_text("\n".join(order)+"\n")
          print("DEEPMIND_RH_TERMINAL_CLOSURE_COUNT", len(order))
          for m in order:
              print(m, selected(m))
          PY

      - name: Compile V13 terminal closure
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/.aegis-base/sovereign-omega-v2/formal/bridges/lean"
          LOCAL="$GITHUB_WORKSPACE/AegisRH/PR606"
          SRC="$GITHUB_WORKSPACE/.port-source/AegisRH/PR606/Source"
          COMPAT="$GITHUB_WORKSPACE/.port-source/AegisRH/PR606/Compat"
          OUT="$GITHUB_WORKSPACE/.lake/deepmind-rh-target"
          ROOT_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$LOCAL:$COMPAT:$SRC:$BASE:$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$ROOT_LEAN_PATH"

          while IFS= read -r MOD; do
            [ -z "$MOD" ] && continue
            FILE="$BASE/$MOD.lean"
            [ -f "$SRC/$MOD.lean" ] && FILE="$SRC/$MOD.lean"
            [ -f "$COMPAT/$MOD.lean" ] && FILE="$COMPAT/$MOD.lean"
            [ -f "$LOCAL/$MOD.lean" ] && FILE="$LOCAL/$MOD.lean"
            echo "=== $MOD ==="
            lean -o "$OUT/$MOD.olean" "$FILE"
          done < "$GITHUB_WORKSPACE/.deepmind-rh-order.txt"

      - name: Compile source-bound canonical RH proved-window join
        shell: bash
        run: |
          set -euo pipefail
          export RH_WINDOW_SRC_OVERRIDE="$GITHUB_WORKSPACE/.port-source/AegisRH/PR606/Source"
          export RH_WINDOW_COMPAT_OVERRIDE="$GITHUB_WORKSPACE/.port-source/AegisRH/PR606/Compat"
          bash scripts/rh_pr63_proved_window_prebuild.sh "$GITHUB_WORKSPACE/.lake/deepmind-rh-target"

      - name: Compile current DeepMind RH target
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/.aegis-base/sovereign-omega-v2/formal/bridges/lean"
          LOCAL="$GITHUB_WORKSPACE/AegisRH/PR606"
          SRC="$GITHUB_WORKSPACE/.port-source/AegisRH/PR606/Source"
          COMPAT="$GITHUB_WORKSPACE/.port-source/AegisRH/PR606/Compat"
          OUT="$GITHUB_WORKSPACE/.lake/deepmind-rh-target"
          ROOT_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$LOCAL:$COMPAT:$SRC:$BASE:$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$ROOT_LEAN_PATH"

          lake build FormalConjecturesUtil
          python3 -m unittest discover -s scripts -p test_rh_official_target_gate.py -v
          EVIDENCE="$GITHUB_WORKSPACE/evidence-rh-official"
          mkdir -p "$EVIDENCE"
          export RH_EXACT_HEAD="$(git rev-parse HEAD)"
          TARGET="FormalConjectures/Millennium/RiemannHypothesis.lean"
          test -f "$TARGET"
          ! grep -n -A3 'theorem riemannHypothesis : RiemannHypothesis' "$TARGET" | grep -F 'sorry'
          mkdir -p .lake/build/lib/lean/FormalConjectures/Millennium
          set +e
          lean -o .lake/build/lib/lean/FormalConjectures/Millennium/RiemannHypothesis.olean "$TARGET" > "$EVIDENCE/target-compile.log" 2>&1
          lean_rc=$?
          set -e
          cat "$EVIDENCE/target-compile.log"
          python3 scripts/rh_official_target_gate.py \
            --source "$TARGET" --log "$EVIDENCE/target-compile.log" \
            --lean-exit "$lean_rc" --receipt "$EVIDENCE/receipt.json"

          cat >/tmp/DeepMindRHTargetAudit.lean <<'LEAN'
          import FormalConjectures.Millennium.RiemannHypothesis
          #print axioms RiemannHypothesis.riemannHypothesis
          LEAN
          lean /tmp/DeepMindRHTargetAudit.lean 2>&1 | tee "$EVIDENCE/target-axioms.log"
          python3 scripts/rh_official_target_gate.py \
            --source "$TARGET" --log "$EVIDENCE/target-compile.log" \
            --lean-exit 0 --axioms-log "$EVIDENCE/target-axioms.log" \
            --receipt "$EVIDENCE/receipt.json"

      - name: Upload exact RH target evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-official-target-${{ github.run_id }}
          path: evidence-rh-official/
          if-no-files-found: warn
          retention-days: 30
