name: RH Krein M8 analytic exact-source replay
on:
  pull_request:
    paths:
      - 'research/rh/m8_kernel_v1/**'
      - '.github/workflows/rh-krein-m8-analytic-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  AEGIS_SHA: 2c3d041b633147ec97c7ef753aa9d157a47bb9f5
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  FACTORIZATION_SOURCE_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2
jobs:
  m8-analytic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout immutable PR51 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e279d5765b2dc0cb8b4ec4f62b8db96b4dc69121
          path: .baseline
          persist-credentials: false
      - name: Test replay harness
        run: |
          set -euo pipefail
          mkdir -p evidence-m8-kernel
          python3 research/rh/m8_kernel_v1/test_replay.py -v 2>&1 | tee evidence-m8-kernel/harness-tests.log
          python3 research/rh/m8_kernel_v1/test_binding.py -v 2>&1 | tee evidence-m8-kernel/binding-tests.log
          python3 research/rh/m8_kernel_v1/test_private_axioms.py -v 2>&1 | tee evidence-m8-kernel/private-axiom-tests.log
          python3 research/rh/m8_kernel_v1/test_namespace_axioms.py -v 2>&1 | tee evidence-m8-kernel/namespace-axiom-tests.log
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version | tee evidence-m8-kernel/lean-version.txt
          git rev-parse HEAD > evidence-m8-kernel/verifier-head.txt
      - name: Checkout exact AEGIS baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          persist-credentials: false
      - name: Checkout exact external provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          path: .li-provider
          persist-credentials: false
      - name: Restore pinned provider build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li-provider/.lake/build
          key: rh-li-provider-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.LI_CRITERION_SHA }}-${{ env.MATHLIB_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}
      - name: Apply and build previously audited provider compatibility overlay
        run: python3 research/rh/m8_kernel_v1/replay.py provider
      - name: Fresh local closure and compact-support red-green replay
        run: python3 research/rh/m8_kernel_v1/replay.py upstream
      - name: New M8 producer and strict endpoint axiom audit
        run: python3 research/rh/m8_kernel_v1/bind_pr52.py
      - name: Upload complete source and proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-m8-analytic-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: evidence-m8-kernel/
          if-no-files-found: error
          retention-days: 30
