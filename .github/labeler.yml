# Limit the number of directory-based labels attached automatically.
# Broad PRs touching many directories (e.g. Lean bumps or repo-wide refactorings)
# that exceed this threshold will have file-based labeling skipped.
changed-files-labels-limit: 5

arxiv:
  - changed-files:
    - any-glob-to-any-file: 'FormalConjectures/Arxiv/**'

attributes:
  - changed-files:
    - any-glob-to-any-file: 'FormalConjecturesUtil/Attributes/**'

Books:
  - changed-files:
    - any-glob-to-any-file: 'FormalConjectures/Books/**'

CI:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/**'
      - 'scripts/**'

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - 'AUTHORS'

erdos-problems:
