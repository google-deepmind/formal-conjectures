name = "formal_conjectures"
keywords = ["math"]
defaultTargets = ["FormalConjecturesUtil", "FormalConjecturesForMathlib"]
testDriver = "FormalConjecturesTest"

[leanOptions]
# Pretty-prints `fun a ↦ b`
pp.unicode.fun = true
# Don't assume a typo is a new variable
autoImplicit = false
relaxedAutoImplicit = false
# Don't open Classical globally
weak.linter.style.openClassical = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

# We make this a separate library so that we can apply different lean options.
[[lean_lib]]
name = "FormalConjecturesForMathlib"
[lean_lib.leanOptions]
weak.linter.style.copyright.formalConjectures = true
weak.linter.style.namespace = true
weak.linter.style.stubs = true

[[lean_lib]]
name = "FormalConjecturesUtil"
globs = ["FormalConjecturesUtil.*"]
[lean_lib.leanOptions]
weak.linter.style.copyright.formalConjectures = true
weak.linter.style.namespace = true
weak.linter.style.stubs = true

[[lean_lib]]
name = "FormalConjecturesTest"
globs = ["FormalConjecturesTest.+"]
[lean_lib.leanOptions]
# Switch off warnings generated by `sorry`
warn.sorry = false
weak.linter.style.copyright.formalConjectures = true
weak.linter.style.namespace = true
weak.linter.style.stubs = true

# When preparing a Palomar submission, add `"Challenge"` and `"Solution"` to
# `defaultTargets` above and uncomment the libraries below:
#
# [[lean_lib]]
# name = "Challenge"
# roots = ["Challenge"]
# [lean_lib.leanOptions]
# warn.sorry = false
#
# [[lean_lib]]
# name = "Solution"
# globs = ["Solution.*"]
